<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>枫叶指令宏文档</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="枫叶指令宏完整语法规范，自动化脚本语言的语法定义与使用说明。">
  <meta property="og:title" content="枫叶指令宏文档">
  <meta property="og:description" content="自动化脚本语言的完整语法定义">
  <meta property="og:type" content="article">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "TechArticle",
    "name": "枫叶指令宏完整语法规范",
    "description": "自动化脚本语言的完整语法定义",
    "keywords": "枫叶指令宏, 自动化脚本, 语法规范",
    "version": "1.0",
    "datePublished": "2026-03-19"
  }
  </script>
  <link rel="stylesheet" href="lib/vue.css">
  <style>
    :root {
      --accent: #007acc;
      --bg-main: #ffffff;
      --bg-side: #ffffff;
      --text-main: #333;
      --text-sub: #666;
      --border: #e1e4e8;
    }

    * { box-sizing: border-box; }

    body {
      background: #f6f8fa !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      --sidebar-width: 240px;
    }

    .sidebar {
      background: var(--bg-side) !important;
      border-right: 1px solid var(--border) !important;
      padding-top: 0 !important;
    }

    .sidebar > h1 {
      margin: 0;
      padding: 20px 16px;
      font-size: 16px;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 9;
      background: var(--bg-side);
    }

    .sidebar ul li a {
      font-size: 14px;
      padding: 8px 16px;
      margin: 2px 12px;
      border-radius: 6px;
      color: var(--text-main);
      transition: all 0.2s ease;
      display: block;
    }

    .sidebar ul li a:hover {
      background-color: #f3f4f6;
      text-decoration: none;
    }

    .sidebar ul li a.active {
      background-color: var(--accent) !important;
      color: white !important;
      font-weight: 500;
    }

    .sidebar ul ul {
      padding-left: 8px;
      margin-left: 8px;
      border-left: 1px solid var(--border);
    }

    .content {
      padding-top: 20px !important;
      padding-bottom: 40px !important;
      background: transparent !important;
    }

    .markdown-section {
      max-width: 1000px !important;
      margin: 0 auto !important;
      padding: 32px !important;
      background: var(--bg-main) !important;
      border-radius: 8px !important;
      border: 1px solid var(--border) !important;
      min-height: calc(100vh - 40px) !important;
    }

    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 3px;
    }
    .sidebar {
      scrollbar-width: thin;
      scrollbar-color: #d1d5db transparent;
    }

    @media (max-width: 768px) {
      .content {
        padding: 0 !important;
      }
      .markdown-section {
        margin: 0 !important;
        border-radius: 0 !important;
        border: none !important;
        padding: 20px 16px !important;
        min-height: 100vh !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '📄 枫叶指令宏文档',
      loadSidebar: true,
      subMaxLevel: 3,
      emoji: true,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索文档...',
        noData: '没有找到结果',
        depth: 4
      },
      plugins: [
        function (hook, vm) {
          hook.doneEach(function () {
            // 每次换页先清掉旧按钮
            var old = document.getElementById('ai-copy-btn');
            if (old) old.remove();

            // 只在 AI 文档页加按钮
            var path = vm.route.path;
            if (path !== '/aiyfgf' && path !== '/aiyfgf.md') return;

            // 创建按钮
            var btn = document.createElement('button');
            btn.id = 'ai-copy-btn';
            btn.textContent = '📋 一键复制全文给 AI';
            btn.style.cssText = [
              'position:fixed',
              'right:30px',
              'bottom:80px',
              'z-index:9999',
              'padding:12px 22px',
              'background:#007acc',
              'color:#fff',
              'border:none',
              'border-radius:8px',
              'cursor:pointer',
              'font-size:14px',
              'font-weight:600',
              'box-shadow:0 4px 14px rgba(0,122,204,.35)',
              'transition:all .2s'
            ].join(';');
            btn.onmouseover = function () { btn.style.background = '#005fa3'; };
            btn.onmouseout  = function () { btn.style.background = '#007acc'; };

            btn.onclick = function () {
              fetch('aiyfgf.md')
                .then(function (r) { return r.text(); })
                .then(function (text) {
                  return copyText(text);
                })
                .then(function () {
                  btn.textContent = '✅ 已复制！粘贴给 AI 即可';
                  setTimeout(function () {
                    btn.textContent = '📋 一键复制全文给 AI';
                  }, 2200);
                })
                .catch(function () {
                  btn.textContent = '❌ 复制失败，请手动选择';
                  setTimeout(function () {
                    btn.textContent = '📋 一键复制全文给 AI';
                  }, 2200);
                });
            };

            // 复制到剪贴板（带降级方案）
            function copyText(text) {
              if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
              }
              return new Promise(function (resolve, reject) {
                try {
                  var ta = document.createElement('textarea');
                  ta.value = text;
                  ta.style.position = 'fixed';
                  ta.style.left = '-9999px';
                  document.body.appendChild(ta);
                  ta.select();
                  document.execCommand('copy');
                  document.body.removeChild(ta);
                  resolve();
                } catch (e) { reject(e); }
              });
            }

            document.body.appendChild(btn);
          });
        }
      ]
    };
  </script>
  <script src="lib/docsify.min.js"></script>
  <script src="lib/plugins/search.min.js"></script>
  <script src="lib/plugins/emoji.min.js"></script>
  <script src="lib/plugins/zoom-image.min.js"></script>
</body>
</html>
